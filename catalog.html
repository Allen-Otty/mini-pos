<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Products &amp; Inventory · Dogo POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
  <div id="dogoHeaderRoot"></div>
  <div id="dogoNavRoot"></div>
  <main class="dogo-page">
    <div class="dogo-breadcrumb">Dashboard <span>›</span> <span class="is-current">Products</span></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:24px;font-weight:800;margin:0 0 4px;color:var(--dogo-ink);">Product Catalogue</h1>
        <p style="font-size:14px;color:var(--dogo-text-muted);margin:0;" id="bizName">Manage your shop items and inventory levels</p>
      </div>
      <button style="background:#d97706;color:#fff;border:none;border-radius:var(--dogo-radius-pill);padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(217,119,6,0.25);" id="addBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New Product / Service</span>
      </button>
    </div>

    <div class="dogo-toolbar" style="justify-content:space-between;margin-bottom:14px;">
      <div class="dogo-seg" id="viewSeg">
        <button data-v="all" class="is-active">All Products</button>
        <button data-v="inventory">Low Stock &amp; Alerts</button>
      </div>
    </div>
    <section class="dogo-card">
      <div class="dogo-toolbar" style="margin-bottom:14px;">
        <input class="dogo-input" id="q" placeholder="Search name, code or category">
        <button class="dogo-btn dogo-btn--outline dogo-btn--sm" id="csvBtn">Export CSV</button>
        <button class="dogo-btn dogo-btn--outline dogo-btn--sm" onclick="window.print()">Print</button>
      </div>
      <div class="dogo-table-wrap"><table class="dogo-table">
        <thead><tr><th>Code / SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Tax Rate</th><th>Stock</th><th>Reorder</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="dogo-pager"><span id="pageInfo"></span><span><button class="dogo-btn dogo-btn--outline dogo-btn--sm" id="prev">Prev</button> <button class="dogo-btn dogo-btn--outline dogo-btn--sm" id="next">Next</button></span></div>
    </section>

    <!-- Create Item Modal Matching Screenshot 291 -->
    <div class="dogo-modal" id="modal">
      <div class="dogo-modal__box" style="max-width:540px;border-radius:18px;padding:24px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
          <div>
            <h2 style="font-size:20px;font-weight:800;color:var(--dogo-ink);margin:0 0 2px;" id="mTitle">Create Item</h2>
            <div style="font-size:13px;color:var(--dogo-text-muted);">Add a new product or service to your catalog</div>
          </div>
          <button style="border:none;background:transparent;color:var(--dogo-text-muted);font-size:20px;cursor:pointer;" id="mClose">&times;</button>
        </div>

        <div style="margin-top:14px;">
          <div class="dogo-form-row dogo-form-row--2" style="gap:12px;margin-bottom:10px;">
            <div class="dogo-field" style="margin:0;">
              <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">NAME</label>
              <input class="dogo-input" id="fName" placeholder="Product name" style="background:#f8fafc;">
            </div>
            <div class="dogo-field" style="margin:0;">
              <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">PRICE</label>
              <input class="dogo-input" id="fPrice" type="number" step="0.01" min="0" value="0.00" style="background:#f8fafc;">
            </div>
          </div>

          <div class="dogo-form-row dogo-form-row--2" style="gap:12px;margin-bottom:10px;">
            <div class="dogo-field" style="margin:0;">
              <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">SKU *</label>
              <input class="dogo-input" id="fCode" placeholder="Required" style="background:#f8fafc;">
            </div>
            <div class="dogo-field" style="margin:0;">
              <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">BARCODE</label>
              <div style="display:flex; gap:6px;">
                <input class="dogo-input" id="fBarcode" placeholder="Scan or type" style="background:#f8fafc;">
                <button class="dogo-btn dogo-btn--outline" id="barcodeScanBtn" type="button" title="Scan barcode with camera" style="padding:0 12px; white-space:nowrap;">📷</button>
              </div>
            </div>
            <div id="barcodeScanPanel" style="display:none; margin:8px 0;">
              <div id="barcodeReader" style="border-radius:12px; overflow:hidden; max-width:360px;"></div>
              <div id="barcodeScanMsg" style="font-size:12px; color:var(--dogo-text-muted); margin-top:4px;">Point the camera at the product barcode.</div>
            </div>
          </div>

          <div class="dogo-form-row dogo-form-row--2" style="gap:12px;margin-bottom:10px;">
            <div class="dogo-field" style="margin:0;">
              <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">CATEGORY</label>
              <select class="dogo-select" id="fCat" style="background:#f8fafc;">
                <option value="">Select Category (Optional)</option>
                <option value="General">General</option>
                <option value="Groceries">Groceries</option>
                <option value="Beverages">Beverages</option>
                <option value="Dairy">Dairy</option>
                <option value="Bakery">Bakery</option>
                <option value="Snacks">Snacks</option>
              </select>
            </div>
            <div class="dogo-field" style="margin:0;">
              <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">TAX TYPE *</label>
              <select class="dogo-select" id="fVat" style="background:#f8fafc;">
                <option value="0.16">A (16%) - Standard Rate</option>
                <option value="0">B (0%) - Zero Rated</option>
                <option value="0">C (0%) - Exempt</option>
                <option value="0">D (0%) - Non - VAT</option>
                <option value="0.08">E (8%) - Petroleum</option>
              </select>
            </div>
          </div>

          <div class="dogo-field" style="margin-bottom:10px;">
            <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">TYPE</label>
            <select class="dogo-select" id="fType" style="background:#f8fafc;">
              <option value="Product">Product</option>
              <option value="Service">Service</option>
            </select>
          </div>

          <div class="dogo-field" style="margin-bottom:12px;">
            <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">DESCRIPTION</label>
            <input class="dogo-input" id="fDesc" placeholder="Product description..." style="background:#f8fafc;">
          </div>

          <div class="dogo-form-row dogo-form-row--2" style="gap:12px;margin-bottom:16px;">
            <div class="dogo-field" style="margin:0;">
              <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">INITIAL STOCK</label>
              <input class="dogo-input" id="fStock" type="number" step="1" min="0" value="0" style="background:#f8fafc;">
            </div>
            <div class="dogo-field" style="margin:0;">
              <label style="font-size:11px;font-weight:800;color:var(--dogo-text-muted);letter-spacing:0.5px;text-transform:uppercase;">REORDER THRESHOLD</label>
              <input class="dogo-input" id="fReorder" type="number" step="1" min="0" value="0" style="background:#f8fafc;">
            </div>
          </div>

          <div style="display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:16px;">
            <button style="border:none;background:transparent;color:var(--dogo-text-muted);font-weight:700;font-size:14px;cursor:pointer;" id="mCancel">Cancel</button>
            <button style="background:#d97706;color:#fff;border:none;border-radius:var(--dogo-radius-pill);padding:9px 28px;font-size:14px;font-weight:700;cursor:pointer;" id="mSave">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sales history for one product -->
    <div class="dogo-modal" id="histModal">
      <div class="dogo-modal__box" style="max-width:760px;border-radius:18px;padding:24px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
          <div>
            <h2 style="font-size:20px;font-weight:800;color:var(--dogo-ink);margin:0 0 2px;" id="hTitle">Sales history</h2>
            <div style="font-size:13px;color:var(--dogo-text-muted);" id="hSub"></div>
          </div>
          <button style="border:none;background:transparent;color:var(--dogo-text-muted);font-size:20px;cursor:pointer;" id="hClose">&times;</button>
        </div>
        <div id="hSummary" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;"></div>
        <div class="dogo-table-wrap" style="max-height:50vh;overflow:auto;"><table class="dogo-table">
          <thead><tr><th>Date</th><th>Receipt</th><th>Qty</th><th>Price</th><th>Total</th><th>Paid by</th><th>Cashier</th></tr></thead>
          <tbody id="hRows"></tbody>
        </table></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap;">
          <span style="font-size:12px;color:var(--dogo-text-muted);" id="hNote"></span>
          <button class="dogo-btn dogo-btn--outline dogo-btn--sm" id="hCsv">Export CSV</button>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="assets/js/dogo-data.js"></script>
  <script src="assets/js/biz-profiles.js"></script>
  <script src="assets/js/app-shell.js"></script>
  <script>
  (async function () {
    const { sb, kes, esc, boot, toast, downloadCSV } = window.DogoData;

    let view = location.hash === '#inventory' ? 'inventory' : 'all';
    const ctx = await boot('catalog');
    if (!ctx) return;
    const { businessId, isAdmin, profile } = ctx;

    let products = [], page = 1; const PER = 10; let editing = null;
    // The products table only has a barcode column once supabase/migrations/20261004_product_barcode.sql
    // has been run. Probe once so saving works either way (without it, the scanned barcode is used as the SKU).
    let hasBarcodeCol = false;
    sb.from('products').select('barcode').limit(1).then(r => { hasBarcodeCol = !r.error; });
    const $ = id => document.getElementById(id);

    // Wording, categories and item types follow the business type (supermarket, hardware, restaurant...).
    const biz = DogoBiz.profileFor(ctx.business && ctx.business.business_type);
    const isMenu = biz.key === 'restaurant';
    const fieldLabel = id => $(id).closest('.dogo-field').querySelector('label');
    document.querySelector('h1').textContent = biz.pageTitle;
    document.querySelector('#addBtn span').textContent = biz.addLabel;
    $('mTitle').nextElementSibling.textContent = biz.subtitle;
    fieldLabel('fName').textContent = biz.nameLabel;
    $('fName').placeholder = biz.namePlaceholder;
    fieldLabel('fStock').textContent = biz.stockLabel;
    fieldLabel('fReorder').textContent = biz.reorderLabel;
    $('fDesc').placeholder = biz.descPlaceholder;
    DogoBiz.fillSelect($('fType'), biz.types);
    if (isAdmin) $('addBtn').style.display = '';

    // ---------- Barcode scanner (camera) for product add/edit ----------
    // Scanning fills the BARCODE field; if the scanned code already belongs to a
    // product, offer to edit that product instead of creating a duplicate.
    let bcScanner = null, bcRunning = false, bcLast = '', bcLastAt = 0;

    function bcOnScan(decodedText) {
      const now = Date.now();
      if (decodedText === bcLast && now - bcLastAt < 1500) return;
      bcLast = decodedText; bcLastAt = now;
      const known = products.find(x => (x.barcode || '') === decodedText || (x.code || '') === decodedText);
      const msg = $('barcodeScanMsg');
      if (known) {
        if (msg) { msg.innerHTML = '<strong>' + esc(known.name) + '</strong> already has this barcode — opening it for editing.'; msg.style.color = 'var(--dogo-gold-dark)'; }
        stopBcScan();
        openModal(known); // reuse the existing edit flow
        return;
      }
      $('fBarcode').value = decodedText;
      if (msg) { msg.textContent = 'Barcode captured: ' + decodedText; msg.style.color = 'var(--dogo-neon-dark)'; }
      if (navigator.vibrate) navigator.vibrate(80);
      stopBcScan();
    }

    async function stopBcScan() {
      bcRunning = false;
      try { if (bcScanner) await bcScanner.stop(); } catch (e) {}
      $('barcodeScanPanel').style.display = 'none';
      $('barcodeScanBtn').textContent = '📷';
    }

    $('barcodeScanBtn').onclick = async () => {
      if (bcRunning) { stopBcScan(); return; }
      const panel = $('barcodeScanPanel'), msg = $('barcodeScanMsg');
      panel.style.display = 'block';
      if (msg) { msg.textContent = 'Starting camera…'; msg.style.color = ''; }
      try {
        if (!bcScanner) bcScanner = new Html5Qrcode('barcodeReader');
        const cams = await Html5Qrcode.getCameras();
        if (!cams || !cams.length) throw new Error('No camera found');
        let camId = cams[0].id;
        const back = cams.find(c => /back|rear|environment/i.test(c.label || ''));
        if (back) camId = back.id;
        await bcScanner.start(camId, {
          fps: 10, qrbox: { width: 220, height: 140 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        }, bcOnScan, () => {});
        bcRunning = true;
        $('barcodeScanBtn').textContent = '✕';
      } catch (err) {
        const denied = err && (err.name === 'NotAllowedError' || /denied|permission/i.test(String(err)));
        if (msg) msg.innerHTML = denied
          ? 'Camera blocked. Address bar → Permissions → Camera → Allow, then retry.'
          : 'Could not start camera: ' + esc(String(err && err.message || err));
      }
    };

    async function load() {
      const { data, error } = await sb.from('products').select('*').order('name');
      if (error) toast('Could not load products: ' + error.message);
      products = data || []; draw();
    }
    function filtered() {
      const q = $('q').value.trim().toLowerCase();
      return products.filter(p => (!q || [p.name, p.code, p.category].some(v => String(v || '').toLowerCase().includes(q)))
        && (view !== 'inventory' || Number(p.stock) <= Number(p.reorder_level || 0)));
    }
    function draw() {
      const list = filtered(), pages = Math.max(1, Math.ceil(list.length / PER));
      page = Math.min(page, pages);
      const slice = list.slice((page - 1) * PER, page * PER);
      $('rows').innerHTML = slice.length ? slice.map(p => {
        const st = Number(p.stock), low = st <= Number(p.reorder_level || 0);
        return `<tr><td>${esc(p.code)}</td><td><strong>${esc(p.name)}</strong></td><td>${esc(p.category || '—')}</td><td>${kes(p.price)}</td><td>${Math.round(Number(p.vat_rate || 0) * 100)}%</td>
          <td><span class="dogo-badge ${st <= 0 ? 'dogo-badge--danger' : low ? 'dogo-badge--warn' : 'dogo-badge--ok'}">${st}</span></td><td>${esc(p.reorder_level ?? 0)}</td>
          <td style="white-space:nowrap;"><button class="dogo-btn dogo-btn--outline dogo-btn--sm" data-log="${esc(p.id)}">Sales</button>${isAdmin ? ` <button class="dogo-btn dogo-btn--outline dogo-btn--sm" data-edit="${esc(p.id)}">Edit</button> <button class="dogo-btn dogo-btn--outline dogo-btn--sm" data-del="${esc(p.id)}" style="color:#dc2626;border-color:#fca5a5;">Delete</button>` : ''}</td></tr>`;
      }).join('') : '<tr><td colspan="8" class="dogo-card__empty">No products found</td></tr>';
      $('pageInfo').textContent = list.length ? `Showing ${(page - 1) * PER + 1}-${Math.min(page * PER, list.length)} of ${list.length}` : '';
      $('prev').disabled = page <= 1; $('next').disabled = page >= pages;
    }
    document.querySelectorAll('#viewSeg button').forEach(b => {
      b.classList.toggle('is-active', b.dataset.v === view);
      b.onclick = () => { view = b.dataset.v; page = 1; document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('is-active', x === b)); draw(); };
    });
    $('q').oninput = () => { page = 1; draw(); };
    $('prev').onclick = () => { page--; draw(); }; $('next').onclick = () => { page++; draw(); };
    $('csvBtn').onclick = () => downloadCSV('products.csv', [['Code','Name','Category','Price','VAT','Stock','Reorder']].concat(filtered().map(p => [p.code, p.name, p.category, p.price, p.vat_rate, p.stock, p.reorder_level])));

    function openModal(p) {
      editing = p || null; $('mTitle').textContent = (p ? 'Edit ' : 'Create ') + biz.itemWord;
      DogoBiz.fillSelect($('fCat'), biz.categories, {
        placeholder: isMenu ? 'Select menu category' : 'Select Category (Optional)',
        keepValue: p && p.category
      });
      $('fCode').value = p ? p.code : '';
      $('fName').value = p ? p.name : '';
      $('fPrice').value = p ? p.price : '0.00';
      $('fBarcode').value = p ? (p.barcode || '') : '';
      $('fCat').value = p ? (p.category || '') : '';
      $('fVat').value = p ? String(Number(p.vat_rate)) : '0.16';
      $('fType').value = p ? (p.type || biz.defaultType) : biz.defaultType;
      $('fDesc').value = p ? (p.description || '') : '';
      $('fStock').value = p ? p.stock : 0;
      $('fReorder').value = p ? (p.reorder_level || 0) : 0;
      $('modal').classList.add('open');
      $('fName').focus();
    }
    const closeModal = () => $('modal').classList.remove('open');
    $('addBtn').onclick = () => openModal(null);
    $('mCancel').onclick = closeModal;
    $('mClose').onclick = closeModal;

    $('rows').onclick = e => {
      const d = (e.target.closest('button') || {}).dataset || {};
      if (d.edit) openModal(products.find(p => String(p.id) === d.edit));
      else if (d.del) deleteProduct(products.find(p => String(p.id) === d.del));
      else if (d.log) openHistory(products.find(p => String(p.id) === d.log));
    };

    /* ---- Delete (admin only, permanent) ---- */
    async function deleteProduct(p) {
      if (!p || !isAdmin) return;
      if (!navigator.onLine) return toast('Deleting needs a connection.');
      let n = 0;
      try { const r = await sb.from('sale_items').select('id', { count: 'exact', head: true }).eq('product_id', p.id); if (!r.error) n = r.count || 0; } catch (e) {}
      const msg = 'Permanently delete "' + p.name + '" (' + p.code + ')?\n\nThis cannot be undone.'
        + (n ? '\n\nIt appears on ' + n + ' past sale line' + (n === 1 ? '' : 's') + '. Past sales are kept as records, so the database may refuse to delete it.' : '');
      if (!confirm(msg)) return;
      const { data, error } = await sb.from('products').delete().eq('id', p.id).select('id');
      if (error) {
        if (error.code === '23503') return toast('Can\'t delete: "' + p.name + '" is part of past sales, and those records must stay. Set its stock to 0 instead, or ask me to add a Hide option.');
        return toast('Could not delete: ' + error.message);
      }
      if (!data || !data.length) return toast('Nothing was deleted - you may not have permission, or it is already gone.');
      toast('"' + p.name + '" deleted'); load();
    }

    /* ---- Sales history for one product ---- */
    let histRows = [], histProd = null;
    const closeHist = () => $('histModal').classList.remove('open');
    $('hClose').onclick = closeHist;
    async function openHistory(p) {
      if (!p) return;
      histProd = p; histRows = [];
      $('hTitle').textContent = 'Sales history · ' + p.name;
      $('hSub').textContent = 'Every time this item was sold, newest first';
      $('hSummary').innerHTML = ''; $('hNote').textContent = '';
      $('hRows').innerHTML = '<tr><td colspan="7" class="dogo-card__empty">Loading…</td></tr>';
      $('histModal').classList.add('open');
      if (!navigator.onLine) { $('hRows').innerHTML = '<tr><td colspan="7" class="dogo-card__empty">Sales history needs a connection.</td></tr>'; return; }
      const LIMIT = 500;
      const li = await sb.from('sale_items').select('*').eq('product_id', p.id).limit(LIMIT);
      if (li.error) { $('hRows').innerHTML = '<tr><td colspan="7" class="dogo-card__empty">Could not load: ' + esc(li.error.message) + '</td></tr>'; return; }
      const items = li.data || [];
      const ids = [...new Set(items.map(i => i.sale_id).filter(Boolean))];
      const sales = {};
      for (let i = 0; i < ids.length; i += 100) {
        const r = await sb.from('sales').select('id,receipt_no,created_at,payment_method,cashier_id').in('id', ids.slice(i, i + 100));
        (r.data || []).forEach(s => { sales[s.id] = s; });
      }
      const cids = [...new Set(Object.values(sales).map(s => s.cashier_id).filter(Boolean))];
      const names = {};
      if (cids.length) { const r = await sb.from('profiles').select('id,full_name').in('id', cids); (r.data || []).forEach(x => { names[x.id] = x.full_name; }); }
      histRows = items.map(i => {
        const s = sales[i.sale_id] || {};
        const qty = Number(i.qty ?? i.quantity ?? 0), price = Number(i.price ?? i.unit_price ?? p.price ?? 0);
        return { at: s.created_at || i.created_at || '', receipt: s.receipt_no || '', qty, price,
          total: Number(i.line_total ?? (qty * price)), pay: s.payment_method || '', cashier: names[s.cashier_id] || '' };
      }).sort((a, b) => String(b.at).localeCompare(String(a.at)));
      const qtySum = histRows.reduce((a, r) => a + r.qty, 0), revSum = histRows.reduce((a, r) => a + r.total, 0);
      const chip = (l, v) => `<div style="background:#f1f5f9;border-radius:12px;padding:8px 14px;"><div style="font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dogo-text-muted);">${l}</div><div style="font-size:16px;font-weight:800;">${v}</div></div>`;
      $('hSummary').innerHTML = chip('Sales', histRows.length) + chip('Units sold', qtySum) + chip('Revenue', kes(revSum)) + chip('In stock now', esc(p.stock));
      $('hRows').innerHTML = histRows.length ? histRows.map(r => `<tr><td>${esc(r.at ? new Date(r.at).toLocaleString() : '—')}</td><td>${esc(r.receipt || '—')}</td><td>${r.qty}</td><td>${kes(r.price)}</td><td>${kes(r.total)}</td><td>${esc(r.pay || '—')}</td><td>${esc(r.cashier || '—')}</td></tr>`).join('')
        : '<tr><td colspan="7" class="dogo-card__empty">This item has not been sold yet.</td></tr>';
      $('hNote').textContent = items.length >= LIMIT ? 'Showing the first ' + LIMIT + ' sales only.' : '';
    }
    $('hCsv').onclick = () => histProd && downloadCSV('sales-' + (histProd.code || 'item') + '.csv',
      [['Date','Receipt','Qty','Price','Total','Paid by','Cashier']].concat(histRows.map(r => [r.at, r.receipt, r.qty, r.price, r.total, r.pay, r.cashier])));
    $('mSave').onclick = async () => {
      const typedBarcode = ($('fBarcode').value || '').trim();
      const rec = {
        code: $('fCode').value.trim() || typedBarcode || 'SKU-' + Date.now().toString().slice(-4),
        name: $('fName').value.trim(),
        price: parseFloat($('fPrice').value) || 0,
        // On a restaurant, anything not in a menu category is hidden from the till, so one must be chosen.
        category: $('fCat').value || (isMenu ? '' : 'General'),
        vat_rate: parseFloat($('fVat').value) || 0,
        stock: parseFloat($('fStock').value) || 0,
        reorder_level: parseFloat($('fReorder').value) || 0
      };
      if (hasBarcodeCol) rec.barcode = typedBarcode || null;
      if (!rec.name) return toast('Please enter a name for this item');
      if (isMenu && !rec.category) return toast('Pick a menu category so it appears on the till');
      if (isNaN(rec.price) || rec.price < 0) return toast('Please enter a valid price');

      const res = editing ? await sb.from('products').update(rec).eq('id', editing.id)
                          : await sb.from('products').insert(Object.assign({ business_id: businessId, unit: 'piece', created_by: profile ? profile.id : null }, rec));
      if (res.error) return toast('Could not save: ' + res.error.message);
      closeModal(); toast('Item saved to catalogue'); load();
    };
    load();
  })();
  </script>
</body>
</html>
