<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dogo POS — Platform Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0b1329;
    color: #f4f1ea;
    line-height: 1.5;
  }
  header {
    background: #0f172a;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(250, 204, 21, 0.25);
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #f4f1ea;
  }
  header button {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #f4f1ea;
    border-radius: 999px;
    padding: 6px 16px;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .15s;
  }
  header button:hover {
    border-color: #facc15;
    color: #facc15;
  }
  main { max-width: 1040px; margin: 28px auto; padding: 0 16px; }

  #loginBox {
    max-width: 380px;
    margin: 80px auto;
    background: #0f2419;
    color: #f4f1ea;
    border-radius: 20px;
    padding: 32px 26px;
    border: 1px solid rgba(250, 204, 21, 0.2);
    box-shadow: 0 18px 50px -10px rgba(0,0,0,0.6);
  }
  #loginBox h2 { margin-top: 0; text-align: center; font-weight: 800; letter-spacing: -0.02em; }
  #loginBox input {
    width: 100%;
    padding: 12px 14px;
    margin: 8px 0;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.06);
    color: #f4f1ea;
    font-size: 14px;
    outline: none;
  }
  #loginBox input:focus { border-color: #facc15; }
  #loginBox button {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    border: none;
    border-radius: 999px;
    background: #facc15;
    color: #0f172a;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    transition: all .15s;
  }
  #loginBox button:hover { background: #fde047; }
  #loginError { color: #ef4444; font-size: 13px; font-weight: 600; margin-top: 10px; text-align: center; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: #0f2419;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 20px 16px;
    text-align: center;
  }
  .stat-card .num { font-size: 28px; font-weight: 900; color: #facc15; letter-spacing: -0.03em; }
  .stat-card .label { font-size: 12px; font-weight: 700; color: #94a39b; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 13px;
    background: #0f2419;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  th, td { padding: 11px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: left; }
  th { background: rgba(255, 255, 255, 0.04); font-weight: 800; color: #facc15; }
  tr:hover { background: rgba(255, 255, 255, 0.03); }
  .tag { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
  .tag-active { background: rgba(250, 204, 21, 0.18); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
  .tag-suspended { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

  .actions button {
    padding: 6px 12px;
    margin-right: 4px;
    font-size: 11.5px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .12s;
  }
  .actions button:hover { transform: translateY(-1px); }
  .btn-suspend { background: #dc2626; color: #fff; }
  .btn-reactivate { background: #16a34a; color: #fff; }
  .btn-view { background: #0f172a; color: #facc15; border: 1px solid rgba(250, 204, 21, 0.35) !important; }
  .btn-delete { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid #dc2626 !important; }

  .section-title { font-size: 17px; font-weight: 800; margin: 32px 0 10px; color: #facc15; letter-spacing: -0.02em; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #0f172a; border: 1px solid rgba(250, 204, 21, 0.4); color: #facc15;
    padding: 11px 22px; border-radius: 999px; font-size: 13px; font-weight: 700;
    opacity: 0; transition: opacity .3s; z-index: 999;
  }
  .toast.show { opacity: 1; }

  #detailModal {
    display: none; position: fixed; inset: 0; background: rgba(7, 19, 12, 0.75);
    backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 16px;
  }
  #detailModal.show { display: flex; }
  .detail-box {
    background: #0f2419; border: 1px solid rgba(250, 204, 21, 0.25);
    border-radius: 20px; padding: 24px; max-width: 620px; width: 100%;
    max-height: 80vh; overflow-y: auto; box-shadow: 0 18px 50px -10px rgba(0,0,0,0.7);
  }
  .detail-box h3 { margin-top: 0; font-weight: 800; color: #facc15; }
  .close-btn {
    background: #0f172a; color: #f4f1ea; border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px; padding: 9px 20px; font-weight: 700; cursor: pointer; margin-top: 14px;
  }
  .close-btn:hover { border-color: #facc15; color: #facc15; }

  .add-admin-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-admin-row input {
    flex: 1; padding: 11px 14px; border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.06); color: #fff; font-size: 13.5px;
  }
  .add-admin-row button {
    padding: 11px 22px; border: none; border-radius: 999px;
    background: #facc15; color: #0f172a; font-weight: 800; cursor: pointer;
  }
  .add-admin-row button:hover { background: #fde047; }
</style>
</head>
<body>

<div id="loginBox">
  <h2>🔒 Platform Console</h2>
  <p style="text-align:center; font-size:12px; color:#666;">Super Admin access only</p>
  <input type="text" id="pcEmail" placeholder="Email">
  <input type="password" id="pcPassword" placeholder="Password">
  <button onclick="platformLogin()">Sign In</button>
  <div id="loginError"></div>
</div>

<div id="dashboardWrap" style="display:none;">
  <header>
    <h1>🔒 Dogo POS — Platform Console</h1>
    <button onclick="platformLogout()">Log out</button>
  </header>
  <main>
    <div class="stat-grid" id="statGrid"></div>

    <div class="section-title">Businesses</div>
    <table>
      <thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Staff</th><th>Created</th><th>Actions</th></tr></thead>
      <tbody id="bizBody"></tbody>
    </table>

    <div class="section-title">Super Admins</div>
    <table>
      <thead><tr><th>Email</th><th>Primary Owner</th><th>Actions</th></tr></thead>
      <tbody id="adminBody"></tbody>
    </table>
    <div class="add-admin-row">
      <input type="text" id="newAdminEmail" placeholder="Email of user to promote to Super Admin">
      <button onclick="promoteAdmin()">Promote</button>
    </div>

    <div class="section-title">Recent Platform Activity</div>
    <table>
      <thead><tr><th>Time</th><th>Business</th><th>Action</th><th>Actor Role</th></tr></thead>
      <tbody id="auditBody"></tbody>
    </table>
  </main>
</div>

<div id="detailModal">
  <div class="detail-box">
    <h3 id="detailTitle"></h3>
    <div id="detailContent"></div>
    <button class="close-btn" onclick="closeDetail()">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://uzwomzkzqrpiumtnniik.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_wt1aY_uj1ZR4z5RqIgDZQw_qYNoCl7D";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentAdminId = null;
let currentIsPrimary = false;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function platformLogin() {
  const email = document.getElementById('pcEmail').value.trim();
  const password = document.getElementById('pcPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Enter email and password.'; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }

  const resp = await callPlatformFn('stats', {});
  if (resp.error) {
    errEl.textContent = 'Access denied — this account is not a Super Admin.';
    await sb.auth.signOut();
    return;
  }

  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboardWrap').style.display = 'block';
  await loadDashboard();
}

async function platformLogout() {
  await sb.auth.signOut();
  document.getElementById('dashboardWrap').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
}

async function callPlatformFn(action, payload) {
  try {
    const { data: { session } } = await sb.auth.getSession();
    const { data, error } = await sb.functions.invoke('platform-admin', {
      body: { action, payload },
      headers: { Authorization: 'Bearer ' + session.access_token }
    });
    if (error) {
      let msg = error.message;
      try { const ctx = await error.context.json(); if (ctx?.error) msg = ctx.error; } catch(e) {}
      return { error: msg };
    }
    return data.success ? data.data : { error: data.error || 'Unknown error' };
  } catch (e) {
    return { error: String(e) };
  }
}

async function loadDashboard() {
  const stats = await callPlatformFn('stats', {});
  if (!stats.error) {
    document.getElementById('statGrid').innerHTML = `
      <div class="stat-card"><div class="num">${stats.total_businesses}</div><div class="label">Total Businesses</div></div>
      <div class="stat-card"><div class="num">${stats.active_businesses}</div><div class="label">Active</div></div>
      <div class="stat-card"><div class="num">${stats.suspended_businesses}</div><div class="label">Suspended</div></div>
      <div class="stat-card"><div class="num">${stats.total_admins}</div><div class="label">Admins</div></div>
      <div class="stat-card"><div class="num">${stats.total_tellers}</div><div class="label">Tellers</div></div>
      <div class="stat-card"><div class="num">${stats.total_sales_count}</div><div class="label">Total Sales</div></div>
      <div class="stat-card"><div class="num">KES ${Number(stats.total_sales_value).toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="label">Platform GMV</div></div>
    `;
  }

  const businesses = await callPlatformFn('list_businesses', {});
  if (!businesses.error) {
    document.getElementById('bizBody').innerHTML = businesses.map(b => `
      <tr>
        <td>${b.name}</td>
        <td>${b.business_type}</td>
        <td><span class="tag ${b.active ? 'tag-active' : 'tag-suspended'}">${b.active ? 'Active' : 'Suspended'}</span></td>
        <td>${b.profiles?.[0]?.count ?? '—'}</td>
        <td>${new Date(b.created_at).toLocaleDateString()}</td>
        <td class="actions">
          <button class="btn-view" onclick="viewBusiness('${b.id}')">View</button>
          ${b.active
            ? `<button class="btn-suspend" onclick="suspendBiz('${b.id}')">Suspend</button>`
            : `<button class="btn-reactivate" onclick="reactivateBiz('${b.id}')">Reactivate</button>`}
          <button class="btn-delete" onclick="deleteBiz('${b.id}','${b.name.replace(/'/g,"")}')">Delete</button>
        </td>
      </tr>
    `).join('') || '<tr><td colspan="6" style="text-align:center; color:#888;">No businesses yet.</td></tr>';
  }

  const admins = await callPlatformFn('list_platform_admins', {});
  if (!admins.error) {
    const { data: { user } } = await sb.auth.getUser();
    document.getElementById('adminBody').innerHTML = admins.map(a => {
      if (a.user_id === user.id) { currentAdminId = user.id; currentIsPrimary = a.is_primary_owner; }
      return `
      <tr>
        <td>${a.email}</td>
        <td>${a.is_primary_owner ? '⭐ Yes' : 'No'}</td>
        <td class="actions">
          ${a.is_primary_owner
            ? '<span style="color:#888; font-size:12px;">Protected — cannot be removed</span>'
            : `<button class="btn-delete" onclick="demoteAdmin('${a.user_id}')">Remove</button>`}
        </td>
      </tr>`;
    }).join('');
  }

  const audit = await callPlatformFn('audit_log', {});
  if (!audit.error) {
    document.getElementById('auditBody').innerHTML = audit.map(a => `
      <tr>
        <td>${new Date(a.created_at).toLocaleString()}</td>
        <td>${a.business_id || '—'}</td>
        <td>${a.action}</td>
        <td>${a.actor_role || '—'}</td>
      </tr>
    `).join('') || '<tr><td colspan="4" style="text-align:center; color:#888;">No activity yet.</td></tr>';
  }
}

async function suspendBiz(id) {
  const reason = prompt('Reason for suspension (optional):') || '';
  const resp = await callPlatformFn('suspend_business', { business_id: id, reason });
  if (resp.error) { showToast('Error: ' + resp.error); return; }
  showToast('Business suspended');
  loadDashboard();
}
async function reactivateBiz(id) {
  const resp = await callPlatformFn('reactivate_business', { business_id: id });
  if (resp.error) { showToast('Error: ' + resp.error); return; }
  showToast('Business reactivated');
  loadDashboard();
}
async function deleteBiz(id, name) {
  if (!confirm(`Permanently delete "${name}" and ALL its data (products, sales, staff)? This cannot be undone.`)) return;
  const resp = await callPlatformFn('delete_business', { business_id: id });
  if (resp.error) { showToast('Error: ' + resp.error); return; }
  showToast('Business deleted');
  loadDashboard();
}
async function viewBusiness(id) {
  const resp = await callPlatformFn('business_detail', { business_id: id });
  if (resp.error) { showToast('Error: ' + resp.error); return; }
  document.getElementById('detailTitle').textContent = resp.business.name;
  document.getElementById('detailContent').innerHTML = `
    <p><b>Type:</b> ${resp.business.business_type} · <b>Status:</b> ${resp.business.active ? 'Active' : 'Suspended'}</p>
    <p><b>Staff:</b> ${resp.profiles.length} (${resp.profiles.filter(p=>p.role==='admin').length} admin, ${resp.profiles.filter(p=>p.role==='teller').length} teller)</p>
    <p><b>Products:</b> ${resp.products.length} · <b>Recent sales:</b> ${resp.sales.length} · <b>Expenses logged:</b> ${resp.expenses.length}</p>
    <p><b>Total recent sales value:</b> KES ${resp.sales.reduce((s,x)=>s+Number(x.total),0).toFixed(2)}</p>
  `;
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail() { document.getElementById('detailModal').classList.remove('show'); }

async function promoteAdmin() {
  const email = document.getElementById('newAdminEmail').value.trim();
  if (!email) { showToast('Enter an email'); return; }
  const resp = await callPlatformFn('promote_platform_admin', { target_email: email });
  if (resp.error) { showToast('Error: ' + resp.error); return; }
  showToast('Promoted ' + email + ' to Super Admin');
  document.getElementById('newAdminEmail').value = '';
  loadDashboard();
}
async function demoteAdmin(userId) {
  if (!confirm('Remove Super Admin access for this user?')) return;
  const resp = await callPlatformFn('demote_platform_admin', { target_user_id: userId });
  if (resp.error) { showToast('Error: ' + resp.error); return; }
  showToast('Super Admin access removed');
  loadDashboard();
}

// restore session if already logged in as a platform admin
(async function init() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    const resp = await callPlatformFn('stats', {});
    if (!resp.error) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dashboardWrap').style.display = 'block';
      loadDashboard();
    }
  }
})();
</script>
</body>
</html>
