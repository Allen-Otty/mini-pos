name: Build Android APK and Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install and bundle web app (offline)
        working-directory: native
        run: |
          npm install
          node ../scripts/prepare-www.cjs
          npx cap sync android
      - name: Build APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Collect APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk Dogo-POS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dogo-POS-apk
          path: Dogo-POS.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle web app (offline)
        working-directory: native
        run: |
          npm install
          node ../scripts/prepare-www.cjs
      - name: Build Windows installer
        working-directory: native/desktop
        run: |
          npm install
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Dogo-POS-windows-exe
          path: native/desktop/dist/*.exe

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Move the 'latest' tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dogo POS - latest build
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
