name: Build Android APK and Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install and bundle web app (offline)
        working-directory: native
        run: |
          npm install
          node ../scripts/prepare-www.cjs
          npx cap sync android
      - name: Build APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Collect APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk Dogo-POS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dogo-POS-apk
          path: Dogo-POS.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle web app (offline)
        working-directory: native
        run: |
          npm install
          node ../scripts/prepare-www.cjs
      - name: Build Windows installer
        working-directory: native/desktop
        run: |
          npm install
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Dogo-POS-windows-exe
          path: native/desktop/dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
