name: Build Android APK and Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install and bundle web app (offline)
        working-directory: native
        run: |
          npm install
          node ../scripts/prepare-www.cjs
          npx cap sync android
      - name: Build signed release APK
        id: signed
        working-directory: native/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DOGO_VERSION_CODE: ${{ github.run_number }}
          DOGO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dogo-release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/dogo-release.jks"
            ./gradlew assembleRelease
            echo "apk=native/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets missing - building a debug APK (updates may fail to install)"
            ./gradlew assembleDebug
            echo "apk=native/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect APK
        working-directory: ${{ github.workspace }}
        run: cp "${{ steps.signed.outputs.apk }}" Dogo-POS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dogo-POS-apk
          path: Dogo-POS.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle web app (offline)
        working-directory: native
        run: |
          npm install
          node ../scripts/prepare-www.cjs
      - name: Build Windows installer
        working-directory: native/desktop
        run: |
          npm install
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Dogo-POS-windows-exe
          path: native/desktop/dist/*.exe

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Move the 'latest' tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dogo POS - latest build
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
